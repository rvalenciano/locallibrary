[project]
name = "locallibrary"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
]

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
extend-ignore = ["RUF012"]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
]
