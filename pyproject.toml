[project]
name = "locallibrary"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "opensearch-py>=3.2.0",
    "psycopg[binary]>=3.3.6",
    "uvicorn>=0.54.0",
    "whitenoise>=6.12.0",
]

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
extend-ignore = ["RUF012"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "django-stubs>=6.1.2",
    "pre-commit>=4.7.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.1",
]
