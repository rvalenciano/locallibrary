repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: basedpyright
        name: basedpyright
        entry: uv run --locked basedpyright
        language: system
        types: [python]
        pass_filenames: false
